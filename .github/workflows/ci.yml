name: Headless foundation
# The headless subset takes under a minute; the full local suite (Qt, solver, sibling packages) is run with
# tools/dev_checks.py, see docs/TESTING.md.  A push to a branch with an open pull request is covered by the
# pull_request run, so push runs are limited to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: headless-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headless:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]'
      # GUI candidate wheel checks are separately recorded until that dependency is released.
      - run: python -m pytest tests/test_domain.py tests/test_hash_stale.py tests/test_headless.py tests/test_persistence.py tests/test_synthetic.py tests/test_review_contracts.py tests/test_ci_tiers.py -q
      - run: python -m build --wheel
