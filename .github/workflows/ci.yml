name: Headless foundation
on: [push, pull_request, workflow_dispatch]
jobs:
  headless:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[dev]'
      # GUI candidate wheel checks are separately recorded until that dependency is released.
      - run: python -m pytest tests/test_domain.py tests/test_hash_stale.py tests/test_headless.py tests/test_persistence.py tests/test_synthetic.py tests/test_review_contracts.py -q
      - run: python -m build --wheel
